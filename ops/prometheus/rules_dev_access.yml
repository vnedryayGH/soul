groups:
  - name: dev_access_rules
    interval: 30s
    rules:
      - alert: DevAccessHealthFailed
        expr: dev_access_health_status == 0
        for: 2m
        labels:
          severity: warning
          risk: medium
        annotations:
          summary: "DevAccessHealthFailed — dev access health = 0"
          description: |
            Инспектор Dev Access health фиксирует отказ в течение 2 минут.
            Действия: проверить эндпоинт /api/admin/access/health, логи бэкенда, наличие модулей dev_access_*.
            При повторении: создать инцидент P50, снизить нагрузку и выполнить восстановление модулей.

      - alert: DevAccessHealthSlow
        expr: histogram_quantile(0.95, sum(rate(dev_access_health_ms_bucket[5m])) by (le)) > 500
        for: 5m
        labels:
          severity: warning
          risk: medium
        annotations:
          summary: "DevAccessHealthSlow — p95 > 500ms"
          description: |
            p95 времени проверки Dev Access health превышает 500мс в течение 5 минут.
            Действия: проверить БД/FS доступность, блокировки, импорт модулей; оптимизировать проверки инспектора.

