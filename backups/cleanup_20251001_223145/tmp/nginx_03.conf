server {
    listen 80;
    server_name mini.soulpulse.art;

    # ACME challenge для выпуска сертификатов
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/soulpulse/frontend;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name mini.soulpulse.art;

    ssl_certificate /etc/letsencrypt/live/mini.soulpulse.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mini.soulpulse.art/privkey.pem;

    charset utf-8;
    # use explicit set but avoid duplicate of text/html
    charset_types text/plain text/css application/javascript application/json text/xml application/xml;

    root /var/www/soulpulse/frontend;

    # Assets: явные типы и вечный кэш по hash-именам
    location /assets/ {
        types { application/javascript js; text/css css; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html без кэша — предотвращает мигание старой формы
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Content-Security-Policy "worker-src 'none'" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Content-Security-Policy "worker-src 'none'" always;
    }

    # Backend API (при необходимости скорректировать адрес/порт)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Таймауты Hyperloop/LLM: увеличить для долгих операций (502→устранить)
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        # Гашение буфера для стриминга (если включим SSE/websocket)
        proxy_buffering off;
        # Без принудительного upgrade, оставим по умолчанию (ws не используется)
    }

    # WebSocket upgrade for Voice realtime
    location /api/voice/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location = /webhook/telegram {
        proxy_pass http://127.0.0.1:8000/webhook/telegram;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


