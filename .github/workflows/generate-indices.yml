name: Generate ENV and API Indices

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt || true
      - name: Generate indices
        run: |
          python scripts/generate_indices.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: env-api-indices
          path: |
            docs/ENV_INDEX.md
            docs/API_ROUTES_INDEX.md
