name: Runner Smoke
on:
  workflow_dispatch:
jobs:
  info:
    runs-on: [self-hosted, linux]
    steps:
      - name: Print runner info
        run: |
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          uname -a
          whoami
          which python3 || true
          python3 --version || true
