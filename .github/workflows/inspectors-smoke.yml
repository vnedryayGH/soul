name: Inspectors Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Hyperloop TRACE.REQUIRE and INSPECTOR.RUN_ALL
        env:
          API_BASE: https://mini.soulpulse.art/api
          TG_ID: '468326902'
        run: |
          python backend/scripts/test_p44_auth_suite.py

