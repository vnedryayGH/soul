name: Sync Error Playbook to DB

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API base (default https://mini.soulpulse.art/api)"
        required: false
        default: "https://mini.soulpulse.art/api"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync playbook into soul_settings.error_playbook_md
        env:
          HL_API_URL: ${{ inputs.api_url }}
          HYPERLOOP_API_KEY: ${{ secrets.HYPERLOOP_API_KEY }}
          HYPERLOOP_API_SECRET: ${{ secrets.HYPERLOOP_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
import os, json, base64, time, hmac, hashlib, urllib.request, sys

api = (os.getenv('HL_API_URL') or 'https://mini.soulpulse.art/api').rstrip('/')
key = os.getenv('HYPERLOOP_API_KEY', '').strip()
sec = os.getenv('HYPERLOOP_API_SECRET', '').strip()
if not key or not sec:
    print(json.dumps({"detail":"Missing HYPERLOOP_API_KEY/HYPERLOOP_API_SECRET"}))
    sys.exit(2)

with open('docs/SOUL_AGENT_ERROR_PLAYBOOK.md', 'rb') as f:
    b64 = base64.b64encode(f.read()).decode('ascii')

commands = 'DB.UPSERT table=soul_settings key=key values={"key":"soul_settings.error_playbook_md","value":"' + b64 + '"}'
ts = int(time.time())
sig = hmac.new(sec.encode('utf-8'), f"{key}:{ts}:{commands}".encode('utf-8'), hashlib.sha256).hexdigest()
body = {
  "commands": commands,
  "key": key,
  "ts": ts,
  "sig": sig,
  "commands_b64": base64.b64encode(commands.encode('utf-8')).decode('ascii')
}
data = json.dumps(body, ensure_ascii=False).encode('utf-8')
req = urllib.request.Request(api + '/api/hyperloop/execute-signed', data=data, method='POST', headers={'Content-Type':'application/json'})
try:
    with urllib.request.urlopen(req, timeout=30) as resp:
        raw = resp.read().decode('utf-8', errors='replace')
        print(raw)
        try:
            j = json.loads(raw)
        except Exception:
            sys.exit(2)
        # Consider typical shapes and fail on explicit errors
        if isinstance(j, dict):
            if j.get('detail') or str(j.get('status','')).lower() in {'failed','error'}:
                sys.exit(2)
            # If results list is present, ensure all ok
            res = j.get('results')
            if isinstance(res, list) and any((not r.get('ok', True)) for r in res if isinstance(r, dict)):
                sys.exit(2)
        sys.exit(0)
except Exception as e:
    print(json.dumps({"detail":"request_failed","error":str(e)}))
    sys.exit(2)
PY


