name: Green Gate Pre-Merge

on:
  pull_request:
    branches:
      - '**'

jobs:
  green-gate:
    name: Run Green Gate checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show Python version
        run: python --version

      - name: Run pre-merge checks (FLAGS + INSPECTOR.RUN_ALL + Delivery Guard smoke)
        env:
          HL_USER_ID: '468326902'
          # HL_API_URL optional override; default targets https://mini.soulpulse.art/api
          # HL_API_URL: 'https://mini.soulpulse.art/api'
        shell: bash
        run: |
          set -o pipefail
          python backend/scripts/ci/pre_merge_checks.py | tee pre_merge_checks.out

      - name: Upload Green Gate log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: green-gate-log
          path: pre_merge_checks.out


