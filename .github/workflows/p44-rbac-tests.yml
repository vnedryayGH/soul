name: P44 RBAC Negative Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  p44:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run P44 auth suite (negative/positive)
        env:
          API_BASE: https://mini.soulpulse.art/api
          TG_ID: '468326902'
        run: |
          python backend/scripts/test_p44_auth_suite.py

